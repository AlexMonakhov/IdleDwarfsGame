# Деплой в Azure App Service: тесты → dotnet publish (заодно собирает Vue-клиент в wwwroot) → выкладка.
# Запускается на каждый push в main и вручную (Actions → Deploy to Azure → Run workflow).
#
# Нужно один раз настроить в репозитории (Settings → Secrets and variables → Actions):
#   Variables → AZURE_WEBAPP_NAME              — имя App Service (как в портале)
#   Secrets   → AZURE_WEBAPP_PUBLISH_PROFILE   — содержимое файла из «Download publish profile» на странице App Service
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: IdleDwarfsGame.Client/package-lock.json

      - name: Test
        run: dotnet test IdleDwarfsGame.Server.Tests -c Release

      - name: Publish server + client
        run: dotnet publish IdleDwarfsGame.Server/IdleDwarfsGame.Server.csproj -c Release -o publish

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
