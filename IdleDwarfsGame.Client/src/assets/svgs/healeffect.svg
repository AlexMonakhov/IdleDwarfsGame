<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Градиент фона -->
    <radialGradient id="heal-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="65%" stop-color="#008044" />
      <stop offset="100%" stop-color="#002b17" />
    </radialGradient>
    <!-- Свечение креста -->
    <filter id="heal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Внешний круг -->
  <circle cx="50" cy="50" r="45" fill="url(#heal-bg)" stroke="#b3ffd9" stroke-width="3" />
  
  <!-- Медицинский крест -->
  <g fill="#ffffff" filter="url(#heal-glow)">
    <rect x="41" y="23" width="18" height="54" rx="4" />
    <rect x="23" y="41" width="54" height="18" rx="4" />
  </g>
  
  <!-- Искорки/Частицы магии -->
  <circle cx="28" cy="28" r="3" fill="#e6fffa" />
  <circle cx="72" cy="30" r="2" fill="#e6fffa" />
  <circle cx="74" cy="70" r="3.5" fill="#e6fffa" />
  <circle cx="26" cy="68" r="2" fill="#e6fffa" />
</svg>