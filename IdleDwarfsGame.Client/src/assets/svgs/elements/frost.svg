<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="frost-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33ccff" />
      <stop offset="70%" stop-color="#0055cc" />
      <stop offset="100%" stop-color="#001133" />
    </radialGradient>
    <linearGradient id="sapphire-f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ffff" />
      <stop offset="100%" stop-color="#0044aa" />
    </linearGradient>
    <linearGradient id="sapphire-f2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#001166" />
    </linearGradient>
    <filter id="frost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="50" cy="50" r="45" fill="url(#frost-bg)" stroke="#a5f3fc" stroke-width="3" />
  
  <g filter="url(#frost-glow)">
    <!-- Сложная многогранная структура сапфира -->
    <polygon points="32,28 68,28 78,42 78,58 68,72 32,72 22,58 22,42" fill="url(#sapphire-f1)" />
    <!-- Площадка и верхние грани -->
    <polygon points="40,35 60,35 65,42 65,58 60,65 40,65 35,58 35,42" fill="url(#sapphire-f2)" />
    <polygon points="46,42 54,42 56,46 56,54 54,58 46,58 44,54 44,46" fill="#ffffff" opacity="0.85" />
    
    <!-- Лучевые грани -->
    <polygon points="32,28 40,35 35,42 22,42" fill="url(#sapphire-f2)" />
    <polygon points="68,28 60,35 65,42 78,42" fill="url(#sapphire-f1)" />
    <polygon points="68,72 60,65 65,58 78,58" fill="url(#sapphire-f2)" />
    <polygon points="32,72 40,65 35,58 22,58" fill="url(#sapphire-f1)" />

    <polygon points="32,28 68,28 50,20" fill="#ffffff" opacity="0.9" />
    <polygon points="68,72 32,72 50,80" fill="#002266" />

    <!-- Контуры граней -->
    <path d="M 50,20 L 32,28 L 22,42 L 22,58 L 32,72 L 50,80 L 68,72 L 78,58 L 78,42 L 68,28 Z
             M 40,35 L 60,35 L 65,42 L 65,58 L 60,65 L 40,65 L 35,58 L 35,42 Z
             M 46,42 L 54,42 L 56,46 L 56,54 L 54,58 L 46,58 L 44,54 L 44,46 Z
             M 32,28 L 40,35 M 68,28 L 60,35 M 68,72 L 60,65 M 32,72 L 40,65
             M 22,42 L 35,42 M 78,42 L 65,42 M 78,58 L 65,58 M 22,58 L 35,58" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
  </g>
  <circle cx="20" cy="50" r="2" fill="#e6fffa" filter="url(#frost-glow)" />
  <circle cx="80" cy="50" r="2" fill="#e6fffa" filter="url(#frost-glow)" />
</svg>