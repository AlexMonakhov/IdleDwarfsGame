<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Внешнее кольцо -->
    <linearGradient id="outerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3b3" />
      <stop offset="50%" stop-color="#ff6666" />
      <stop offset="100%" stop-color="#cc2222" />
    </linearGradient>

    <!-- Темный фоновый радиальный градиент -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#800005" />
      <stop offset="40%" stop-color="#4a0002" />
      <stop offset="85%" stop-color="#260001" />
      <stop offset="100%" stop-color="#100000" />
    </radialGradient>

    <!-- Внутреннее свечение фона -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#990000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Градиенты для граней кристалла / пирамиды -->
    <linearGradient id="facetLeftTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8888" />
      <stop offset="100%" stop-color="#cc1111" />
    </linearGradient>

    <linearGradient id="facetRightTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#990b0b" />
      <stop offset="100%" stop-color="#4a0202" />
    </linearGradient>

    <linearGradient id="facetCenterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <linearGradient id="facetCenterRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b30000" />
      <stop offset="100%" stop-color="#550000" />
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#b30000" />
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="100%" stop-color="#330000" />
    </linearGradient>

    <!-- Фильтр свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Внешний светящийся ободок -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#ff4d4d" stroke-width="2" opacity="0.4" filter="url(#glow)" />
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#outerRing)" stroke-width="12" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#220000" stroke-width="3" />

  <!-- Основной темный круг/фон -->
  <circle cx="250" cy="250" r="216" fill="url(#bgGrad)" />
  <circle cx="250" cy="250" r="216" fill="url(#innerGlow)" />

  <!-- Маленькие декоративные точки вокруг (3 шт) -->
  <circle cx="250" cy="60" r="6" fill="#ffb3b3" filter="url(#glow)" />
  <circle cx="80" cy="370" r="5" fill="#ffb3b3" opacity="0.8" />
  <circle cx="420" cy="365" r="5" fill="#ffb3b3" opacity="0.8" />

  <!-- Группа кристалла (Пирамиды) -->
  <g id="crystal">
    <!-- Внешнее свечение контура кристалла -->
    <polygon points="250,90 95,360 405,360" fill="none" stroke="#ff6666" stroke-width="8" opacity="0.7" filter="url(#strongGlow)" />

    <!-- Грани кристалла -->
    <!-- Левая верхняя грань -->
    <polygon points="250,90 250,290 180,335 95,360" fill="url(#facetLeftTop)" />
    
    <!-- Левая центральная грань -->
    <polygon points="250,90 250,290 180,335" fill="url(#facetCenterLeft)" />

    <!-- Правая верхняя грань -->
    <polygon points="250,90 405,360 320,335 250,290" fill="url(#facetRightTop)" />

    <!-- Правая центральная грань -->
    <polygon points="250,90 250,290 320,335" fill="url(#facetCenterRight)" />

    <!-- Нижняя левая грань -->
    <polygon points="95,360 180,335 250,385" fill="url(#facetBottomLeft)" />

    <!-- Нижняя правая грань -->
    <polygon points="405,360 320,335 250,385" fill="url(#facetBottomRight)" />

    <!-- Нижний центральный шов/треугольник -->
    <polygon points="180,335 250,290 320,335 250,385" fill="#e60000" opacity="0.3" />
    <polygon points="250,290 250,385 180,335" fill="#ff1a1a" opacity="0.4" />

    <!-- Четкие белые/светлые ребра (White wireframe overlay) -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <!-- Внешний контур -->
      <polygon points="250,90 95,360 250,385 405,360" />
      
      <!-- Внутренние ребра -->
      <line x1="250" y1="90" x2="250" y2="385" />
      <line x1="250" y1="90" x2="180" y2="335" />
      <line x1="250" y1="90" x2="320" y2="335" />
      <line x1="95" y1="360" x2="180" y2="335" />
      <line x1="405" y1="360" x2="320" y2="335" />
      <line x1="180" y1="335" x2="250" y2="385" />
      <line x1="320" y1="335" x2="250" y2="385" />
      <line x1="180" y1="335" x2="250" y2="290" />
      <line x1="320" y1="335" x2="250" y2="290" />
    </g>

    <!-- Блик на вершине -->
    <circle cx="250" cy="90" r="4" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>