<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="nature-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="65%" stop-color="#008033" />
      <stop offset="100%" stop-color="#002b11" />
    </radialGradient>
    <linearGradient id="emerald-f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66ff99" />
      <stop offset="100%" stop-color="#004d1a" />
    </linearGradient>
    <linearGradient id="emerald-f2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b3ffcc" />
      <stop offset="100%" stop-color="#003311" />
    </linearGradient>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="50" cy="50" r="45" fill="url(#nature-bg)" stroke="#a5f3d0" stroke-width="3" />
  
  <g filter="url(#emerald-glow)">
    <!-- Изумрудная многоступенчатая огранка -->
    <polygon points="34,22 66,22 78,34 78,66 66,78 34,78 22,66 22,34" fill="url(#emerald-f1)" />
    <polygon points="40,28 60,28 70,38 70,62 60,72 40,72 30,62 30,38" fill="url(#emerald-f2)" />
    <polygon points="46,35 54,35 60,41 60,59 54,65 46,65 40,59 40,41" fill="#ffffff" opacity="0.85" />
    <polygon points="48,43 52,43 54,47 54,53 52,57 48,57 46,53 46,47" fill="#d9ffec" opacity="0.95" />

    <!-- Угловые соединения граней -->
    <polygon points="34,22 40,28 30,38 22,34" fill="url(#emerald-f2)" />
    <polygon points="66,22 60,28 70,38 78,34" fill="url(#emerald-f1)" />
    <polygon points="66,78 60,72 70,62 78,66" fill="url(#emerald-f2)" />
    <polygon points="34,78 40,72 30,62 22,66" fill="url(#emerald-f1)" />

    <!-- Контуры граней -->
    <path d="M 34,22 L 66,22 L 78,34 L 78,66 L 66,78 L 34,78 L 22,66 L 22,34 Z
             M 40,28 L 60,28 L 70,38 L 70,62 L 60,72 L 40,72 L 30,62 L 30,38 Z
             M 46,35 L 54,35 L 60,41 L 60,59 L 54,65 L 46,65 L 40,59 L 40,41 Z
             M 34,22 L 40,28 M 66,22 L 60,28 M 66,78 L 60,72 M 34,78 L 40,72
             M 22,34 L 30,38 M 78,34 L 70,38 M 78,66 L 70,62 M 22,66 L 30,62" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>