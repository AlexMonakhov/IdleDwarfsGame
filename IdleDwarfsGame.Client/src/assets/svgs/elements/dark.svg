<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Градиент фона -->
    <radialGradient id="void-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc00ff" />
      <stop offset="65%" stop-color="#4a0066" />
      <stop offset="100%" stop-color="#110022" />
    </radialGradient>

    <!-- Градиенты граней Аметиста -->
    <linearGradient id="amethyst-facet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff66ff" />
      <stop offset="100%" stop-color="#800080" />
    </linearGradient>

    <linearGradient id="amethyst-facet-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a0066" />
      <stop offset="100%" stop-color="#da70d6" />
    </linearGradient>

    <!-- Свечение -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Внешний круг -->
  <circle cx="50" cy="50" r="45" fill="url(#void-bg)" stroke="#e6b3ff" stroke-width="3" />
  
  <!-- Классический ограненный аметист по форме референса -->
  <g filter="url(#purple-glow)">
    <!-- Площадка -->
    <polygon points="35,30 65,30 58,38 42,38" fill="#e6b3ff" opacity="0.9" />
    
    <!-- Верхний ярус (Корона) -->
    <polygon points="20,38 35,30 42,38" fill="url(#amethyst-facet-1)" />
    <polygon points="65,30 80,38 58,38" fill="url(#amethyst-facet-2)" />
    <polygon points="35,30 65,30 50,20" fill="#bf55ec" />
    <polygon points="20,38 35,30 50,20" fill="url(#amethyst-facet-2)" />
    <polygon points="65,30 80,38 50,20" fill="url(#amethyst-facet-1)" />

    <!-- Средний ярус -->
    <polygon points="20,38 42,38 50,48 28,48" fill="url(#amethyst-facet-2)" />
    <polygon points="42,38 58,38 50,48" fill="#ff99ff" />
    <polygon points="58,38 80,38 72,48 50,48" fill="url(#amethyst-facet-1)" />

    <!-- Нижняя часть (Павильон с острием) -->
    <polygon points="20,38 28,48 50,82" fill="#4a0066" />
    <polygon points="28,48 50,48 50,82" fill="url(#amethyst-facet-1)" />
    <polygon points="50,48 72,48 50,82" fill="url(#amethyst-facet-2)" />
    <polygon points="72,48 80,38 50,82" fill="#330044" />

    <!-- Каркас/Линии граней -->
    <path d="M 50,20 L 20,38 L 28,48 L 50,82 L 72,48 L 80,38 Z
             M 35,30 L 65,30 L 80,38
             M 35,30 L 20,38
             M 50,20 L 35,30 L 42,38 L 50,20 L 58,38 L 65,30 L 50,20
             M 42,38 L 58,38
             M 28,48 L 50,48 L 72,48
             M 42,38 L 50,48 L 58,38
             M 50,48 L 50,82" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Частицы темной магии -->
  <circle cx="20" cy="28" r="2" fill="#ff99ff" />
  <circle cx="80" cy="28" r="1.5" fill="#ff99ff" />
  <circle cx="18" cy="65" r="1.5" fill="#e6b3ff" />
  <circle cx="82" cy="65" r="2" fill="#e6b3ff" />
</svg>