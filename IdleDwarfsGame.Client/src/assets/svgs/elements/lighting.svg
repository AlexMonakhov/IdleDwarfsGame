<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="topaz-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="65%" stop-color="#ccaa00" />
      <stop offset="100%" stop-color="#4d3d00" />
    </radialGradient>
    <linearGradient id="topaz-f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680" />
      <stop offset="100%" stop-color="#8a6f00" />
    </linearGradient>
    <linearGradient id="topaz-f2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#664d00" />
    </linearGradient>
    <filter id="topaz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="50" cy="50" r="45" fill="url(#topaz-bg)" stroke="#ffe600" stroke-width="3" />
  
  <g filter="url(#topaz-glow)" transform="rotate(-15 50 50)">
    <!-- Прямоугольная изумрудная форма со срезанными углами (как на фото) -->
    <polygon points="32,25 68,25 78,35 78,65 68,75 32,75 22,65 22,35" fill="url(#topaz-f1)" />
    
    <!-- Ступени короны (рамочные грани) -->
    <polygon points="38,31 62,31 70,39 70,61 62,69 38,69 30,61 30,39" fill="url(#topaz-f2)" />
    <polygon points="44,37 56,37 62,43 62,57 56,63 44,63 38,57 38,43" fill="#ffffff" opacity="0.8" />
    <polygon points="48,42 52,42 54,46 54,54 52,58 48,58 46,54 46,46" fill="#fff9cc" opacity="0.95" />

    <!-- Угловые фасеты (скаты к углам) -->
    <polygon points="32,25 38,31 30,39 22,35" fill="url(#topaz-f2)" />
    <polygon points="68,25 62,31 70,39 78,35" fill="url(#topaz-f1)" />
    <polygon points="68,75 62,69 70,61 78,65" fill="url(#topaz-f2)" />
    <polygon points="32,75 38,69 30,61 22,65" fill="url(#topaz-f1)" />

    <!-- Контурные линии огранки -->
    <path d="M 32,25 L 68,25 L 78,35 L 78,65 L 68,75 L 32,75 L 22,65 L 22,35 Z
             M 38,31 L 62,31 L 70,39 L 70,61 L 62,69 L 38,69 L 30,61 L 30,39 Z
             M 44,37 L 56,37 L 62,43 L 62,57 L 56,63 L 44,63 L 38,57 L 38,43 Z
             M 48,42 L 52,42 L 54,46 L 54,54 L 52,58 L 48,58 L 46,54 L 46,46 Z
             M 32,25 L 38,31 M 68,25 L 62,31 M 68,75 L 62,69 M 32,75 L 38,69
             M 22,35 L 30,39 M 78,35 L 70,39 M 78,65 L 70,61 M 22,65 L 30,61" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>