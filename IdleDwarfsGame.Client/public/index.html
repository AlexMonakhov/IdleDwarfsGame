<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Idle Dwarfs</title>
    <!-- Превью ссылки в мессенджерах и соцсетях: краулеры не выполняют JS, поэтому теги здесь, а не во Vue.
         og:image лучше абсолютным адресом — когда будет домен, заменить на https://<домен>/email/welcome-dwarfs.jpg -->
    <meta name="description" content="Idle Dwarfs — assemble a squad of dwarves, combine seven elements and watch them fight on their own. Free browser game.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Idle Dwarfs">
    <meta property="og:description" content="Assemble a squad of dwarves, combine seven elements and watch them fight on their own. Free browser game.">
    <meta property="og:image" content="/email/welcome-dwarfs.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="800">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Idle Dwarfs doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
